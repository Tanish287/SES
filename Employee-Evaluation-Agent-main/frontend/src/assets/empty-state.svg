<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="150" fill="#FAFAFA"/>
  
  <!-- Empty folder -->
  <path d="M50 60 L70 60 L75 55 L150 55 L150 120 L50 120 Z" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  
  <!-- Folder tab -->
  <path d="M50 60 L70 60 L75 55 L90 55 L85 60 L50 60" fill="#E5E7EB"/>
  
  <!-- Empty content lines -->
  <rect x="65" y="75" width="70" height="2" rx="1" fill="#D1D5DB" opacity="0.5"/>
  <rect x="65" y="85" width="50" height="2" rx="1" fill="#D1D5DB" opacity="0.5"/>
  <rect x="65" y="95" width="60" height="2" rx="1" fill="#D1D5DB" opacity="0.5"/>
  
  <!-- Floating dots -->
  <circle cx="40" cy="40" r="3" fill="#CBD5E1" opacity="0.6"/>
  <circle cx="160" cy="45" r="2" fill="#CBD5E1" opacity="0.4"/>
  <circle cx="170" cy="130" r="4" fill="#CBD5E1" opacity="0.3"/>
  <circle cx="30" cy="130" r="2" fill="#CBD5E1" opacity="0.5"/>
  
  <!-- Search icon -->
  <circle cx="100" cy="90" r="12" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="109" y1="99" x2="115" y2="105" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Cross lines in search -->
  <line x1="95" y1="85" x2="105" y2="95" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="105" y1="85" x2="95" y2="95" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
</svg>