<svg width="250" height="200" viewBox="0 0 250 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="250" height="200" fill="#F0FDF4"/>
  
  <!-- Trophy base -->
  <rect x="110" y="160" width="30" height="20" rx="3" fill="#A3A3A3"/>
  <rect x="105" y="175" width="40" height="8" rx="4" fill="#737373"/>
  
  <!-- Trophy cup -->
  <ellipse cx="125" cy="140" rx="20" ry="25" fill="#FBBF24"/>
  <ellipse cx="125" cy="125" rx="18" ry="8" fill="#F59E0B"/>
  
  <!-- Trophy handles -->
  <ellipse cx="100" cy="130" rx="8" ry="15" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <ellipse cx="150" cy="130" rx="8" ry="15" fill="none" stroke="#F59E0B" stroke-width="3"/>
  
  <!-- Trophy stem -->
  <rect x="122" y="155" width="6" height="10" fill="#A3A3A3"/>
  
  <!-- Winner ribbon -->
  <rect x="140" y="90" width="4" height="30" fill="#EF4444"/>
  <polygon points="140,120 144,120 142,125" fill="#DC2626"/>
  
  <!-- Stars around trophy -->
  <polygon points="80,80 82,85 87,85 83,88 85,93 80,90 75,93 77,88 73,85 78,85" fill="#FBBF24"/>
  <polygon points="170,70 172,75 177,75 173,78 175,83 170,80 165,83 167,78 163,75 168,75" fill="#FBBF24"/>
  <polygon points="200,110 202,115 207,115 203,118 205,123 200,120 195,123 197,118 193,115 198,115" fill="#FBBF24"/>
  <polygon points="50,110 52,115 57,115 53,118 55,123 50,120 45,123 47,118 43,115 48,115" fill="#FBBF24"/>
  
  <!-- Confetti -->
  <rect x="90" y="50" width="3" height="8" rx="1" fill="#3B82F6" transform="rotate(45 90 50)"/>
  <rect x="160" y="45" width="3" height="8" rx="1" fill="#EF4444" transform="rotate(-30 160 45)"/>
  <rect x="180" y="80" width="3" height="8" rx="1" fill="#10B981" transform="rotate(60 180 80)"/>
  <rect x="70" y="60" width="3" height="8" rx="1" fill="#8B5CF6" transform="rotate(-45 70 60)"/>
  <rect x="40" y="70" width="3" height="8" rx="1" fill="#F59E0B" transform="rotate(30 40 70)"/>
  
  <!-- Floating circles -->
  <circle cx="60" cy="40" r="4" fill="#34D399" opacity="0.6"/>
  <circle cx="190" cy="40" r="3" fill="#60A5FA" opacity="0.7"/>
  <circle cx="220" cy="160" r="5" fill="#F472B6" opacity="0.5"/>
  <circle cx="30" cy="150" r="3" fill="#A78BFA" opacity="0.6"/>
  
  <!-- Checkmark in circle -->
  <circle cx="125" cy="30" r="15" fill="#10B981"/>
  <path d="M118 30 L123 35 L132 25" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkles -->
  <g fill="#FBBF24">
    <polygon points="30,30 32,35 37,35 33,38 35,43 30,40 25,43 27,38 23,35 28,35"/>
    <polygon points="210,30 212,35 217,35 213,38 215,43 210,40 205,43 207,38 203,35 208,35"/>
  </g>
</svg>