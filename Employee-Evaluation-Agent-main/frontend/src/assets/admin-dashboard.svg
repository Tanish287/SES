<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F8FAFC"/>
  
  <!-- Dashboard screens -->
  <rect x="40" y="40" width="80" height="60" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="140" y="40" width="80" height="60" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="240" y="40" width="40" height="60" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Content bars -->
  <rect x="45" y="45" width="70" height="4" rx="2" fill="#3B82F6"/>
  <rect x="45" y="52" width="50" height="3" rx="1.5" fill="#9CA3AF"/>
  <rect x="45" y="58" width="60" height="3" rx="1.5" fill="#9CA3AF"/>
  
  <rect x="145" y="45" width="70" height="4" rx="2" fill="#10B981"/>
  <rect x="145" y="52" width="45" height="3" rx="1.5" fill="#9CA3AF"/>
  <rect x="145" y="58" width="55" height="3" rx="1.5" fill="#9CA3AF"/>
  
  <!-- Charts -->
  <circle cx="260" cy="60" r="12" fill="#EFF6FF"/>
  <path d="M252 60 A8 8 0 0 1 268 60 Z" fill="#3B82F6"/>
  
  <!-- Bottom section -->
  <rect x="40" y="120" width="220" height="60" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Table rows -->
  <rect x="45" y="130" width="210" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="45" y="142" width="210" height="8" rx="2" fill="#FFFFFF"/>
  <rect x="45" y="154" width="210" height="8" rx="2" fill="#F3F4F6"/>
  <rect x="45" y="166" width="210" height="8" rx="2" fill="#FFFFFF"/>
  
  <!-- Icons -->
  <circle cx="20" cy="20" r="8" fill="#3B82F6"/>
  <rect x="17" y="17" width="6" height="6" rx="1" fill="white"/>
  
  <!-- Floating elements -->
  <circle cx="280" cy="30" r="3" fill="#F59E0B" opacity="0.6"/>
  <circle cx="20" cy="180" r="4" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="280" cy="180" r="2" fill="#EF4444" opacity="0.5"/>
</svg>